upstream sarvathaa_app {
    server unix:/run/sarvathaa/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name sarvathaa.com www.sarvathaa.com;

    client_max_body_size 20M;

    # JS/CSS use stable filenames: revalidate on every load after git pull.
    location ^~ /assets/js/ {
        alias /var/www/sarvathaa/assets/js/;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ^~ /assets/css/ {
        alias /var/www/sarvathaa/assets/css/;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ^~ /assets/videos/ {
        proxy_pass http://sarvathaa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
    }

    location ^~ /assets/ {
        alias /var/www/sarvathaa/assets/;
        access_log off;
        expires 1d;
    }

    location ~ ^/(private_course_docs|deploy)/ {
        return 404;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ~ \.(py|sql|env|ini|log)$ {
        return 404;
    }

    location / {
        proxy_pass http://sarvathaa_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
